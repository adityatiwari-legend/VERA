services:
  vera-db:
    image: postgres:16-alpine
    container_name: vera-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vera
    ports:
      # Mapped to host port 5433 for local host development/testing
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vera"]
      interval: 5s
      timeout: 5s
      retries: 5

  vera-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vera-app
    restart: unless-stopped
    depends_on:
      vera-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@vera-db:5432/vera
      JWT_SECRET: vera-super-secret-jwt-key-for-development-32chars!
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PORT: 3000
      STORAGE_PATH: /app/storage
      MAX_UPLOAD_SIZE_MB: 50
      CONTRACT_ADDRESS: "0x0B306BF915C4d645ff596e518fAf3F9669b97016"
      BLOCKCHAIN_RPC_URL: "http://host.docker.internal:8545"
      NEXT_PUBLIC_CHAIN_ID: "31337"
    ports:
      - "3000:3000"
    volumes:
      - vera_storage:/app/storage

  nginx:
    image: nginx:alpine
    container_name: vera-nginx
    restart: unless-stopped
    depends_on:
      - vera-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot

volumes:
  postgres_data:
    name: hackxxmuj_postgres_data
    external: true
  vera_storage:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local
