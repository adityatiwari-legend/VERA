services:
  vera-db:
    image: postgres:16-alpine
    container_name: vera-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vera
    ports:
      # Mapped to host port 5433 for local host development/testing
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vera"]
      interval: 5s
      timeout: 5s
      retries: 5

  vera-app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined at build time — sourced from the project .env
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-31337}
        NEXT_PUBLIC_HISAAB_PROGRAM_ID: ${NEXT_PUBLIC_HISAAB_PROGRAM_ID:-}
    container_name: vera-app
    restart: unless-stopped
    depends_on:
      vera-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@vera-db:5432/vera
      # Values without a default here come from the project .env file
      # (see .env.example). Locally you can keep the compose defaults.
      JWT_SECRET: ${JWT_SECRET:-vera-super-secret-jwt-key-for-development-32chars!}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      PORT: 3000
      STORAGE_PATH: /app/storage
      MAX_UPLOAD_SIZE_MB: 50
      DEBUG_SQL: ${DEBUG_SQL:-false}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      # Points at the local hardhat-node service (chainId 31337)
      BLOCKCHAIN_RPC_URL: "http://hardhat-node:8545"
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-31337}
      BLOCKCHAIN_NETWORK: ${BLOCKCHAIN_NETWORK:-hardhat}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      HISAAB_RPC_URL: ${HISAAB_RPC_URL:-https://api.devnet.solana.com}
      HISAAB_ORACLE_KEYPAIR: ${HISAAB_ORACLE_KEYPAIR:-}
      HISAAB_FUNDER_KEYPAIR: ${HISAAB_FUNDER_KEYPAIR:-}
      HISAAB_CONTRACTOR_PUBKEY: ${HISAAB_CONTRACTOR_PUBKEY:-}
      NEXT_PUBLIC_HISAAB_PROGRAM_ID: ${NEXT_PUBLIC_HISAAB_PROGRAM_ID:-}
      SOL_INR_RATE: ${SOL_INR_RATE:-20000}
      ROUGHNESS_THRESHOLD: ${ROUGHNESS_THRESHOLD:-3.0}
      TIGER_DATABASE_URL: ${TIGER_DATABASE_URL:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      ETH_INR_RATE: ${ETH_INR_RATE:-300000}
    ports:
      - "3000:3000"
    volumes:
      - vera_storage:/app/storage

  # One-off migration/seed runner — NOT started by `up -d` (profile-gated).
  # Usage: docker compose run --rm migrate           (db:migrate)
  #        docker compose run --rm migrate npm run db:seed
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    container_name: vera-migrate
    profiles: ["tools"]
    depends_on:
      vera-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@vera-db:5432/vera
    command: npm run db:migrate

  hardhat-node:
    build:
      context: .
      dockerfile: Dockerfile
      target: hardhat
    container_name: vera-hardhat
    restart: unless-stopped
    ports:
      - "8545:8545"

  nginx:
    image: nginx:alpine
    container_name: vera-nginx
    restart: unless-stopped
    depends_on:
      - vera-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot

volumes:
  postgres_data:
    name: hackxxmuj_postgres_data
    external: true
  vera_storage:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local
